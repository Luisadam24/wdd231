name: Deploy WDD231 site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Prepare the Pages files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Fetch Harare weather for the public page
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: node .github/scripts/fetch-weather.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
